# Automated build and test pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (Root)
        run: npm install

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm install

      - name: Mock Compact Compilation
        run: |
          echo "Simulating compact compile on CI..."
          echo "Compilation of PayZK.compact completed successfully."

      - name: Run Tests
        run: npm run test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
