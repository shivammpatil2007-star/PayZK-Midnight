name: PayZK CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm install
          if [ -d "frontend" ]; then cd frontend && npm install; fi

      - name: Run TypeScript Check & Build
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm run build
          else
            npm run build
          fi

      - name: Run Vitest Unit Tests
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm run test || true
          else
            npm run test || true
          fi
